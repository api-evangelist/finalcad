  /organizations/{organization_id}/workspaces/{workspace_id}/modules/{module_id}:
    put:
      operationId: workspacesModulesFormModuleTypeUpdateModule
      summary: Update module
      description: "You can modify a specific form module in a specific workspace.\n\n Endpoint mandatory infos \n Details\
        \ \n\n organization_Id \n the id of the organization to be modified \n\n workspace_id \n id of your workspace \n\n\
        \ module_id \n id of the module to be modified \n\n body options infos \n Details \n\n name \n name of the new module\
        \ \n\n icon \n name of the icon \n(look at finalcad libraries) \n\n color \n rbg value of the color \n(look at finalcad\
        \ libraries) \n\n visibility \n visibiity of the module in the module suggestion s list in project creation \nDefault=>checked\
        \ by default \nAvailable => unchecked by default \nNotAvailable => not in the list"
      tags:
      - Workspaces
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `organization_id` as published in the collection.
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `workspace_id` as published in the collection.
      - name: module_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `module_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: qsdfgh
