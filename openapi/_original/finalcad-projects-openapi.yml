      summary: Create observation
      description: "Going along with the option to create a project from scratch, you can now also create observations in\
        \ a project using just a few parameters.\n\n Details \n\n project_id \n The ID of the project where the the observation\
        \ will be created \n\n Body mandatory infos \n Details \n\n module_id \n Id of the module \n\n Body optional infos\
        \ \n \n Details \n\n description \n Your best wording to describe the observation \n\n trade_id \n The ID of the category\
        \ used in the observation \n\n common_observation_id \n The ID of the model used in the new observation \n\n priority_id\
        \ \n The ID of the priority of the new observation. If not set the default one will be used \n\n status_id \n The\
        \ ID of the status of the new observation. \nIf not set the default one will be used \n\n assignee_id \n The ID of\
        \ the user that will have the new observation assigned \n\n phase_id \n The ID of the phase that is set for the new\
        \ observation. \n\n company_id \n The ID of the company that will be assigned to the new observation \n\n plan_id\
        \ \n The ID of the plan used for the observation \n\n position_x \n X coordinate of the item regarding the affected\
        \ 2D plan \n\n position_y \n Y coordinate of the item regarding the affected 2D plan \n\n due_date \n The due date\
        \ of the observation, set as a date format \n\n group_id \n id of the linked discussion group \nthis id is mandatory\
        \ if the module settings is_group_mandatory=true \n\n latitude \n in decimal degres following ISO6709 \n\n longitude\
        \ \n in decimal degres \nfollowing ISO6709 \n\n Please note that the combinations for description , trade_id and common_observation_id\
        \ are limited to only 3 specific cases:\n\n Case 1 : Description, Trade Id, Common observation Id\n\n Case 2 : Trade\
        \ Id, Common observation Id\n\n Case 3 : Description"
      tags:
      - Observations
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
