openapi: 3.2.0
info:
  title: Finalcad One Project Exports API
  version: '2.41'
  summary: 'Project-level operations for Finalcad One construction projects: project details, project libraries, members, locations (folders / plans / IFC), discussion groups, companies, modules (observations / forms / meetings), observations, forms and form answers, documents, phases, meetings and XLSX/PDF exports.'
  description: 'Project-level operations for Finalcad One construction projects: project details, project libraries, members, locations (folders / plans / IFC), discussion groups, companies, modules (observations / forms / meetings), observations, forms and form answers, documents, phases, meetings and XLSX/PDF exports.


    DERIVED, NOT PUBLISHED BY THE PROVIDER. Finalcad publishes no OpenAPI. This document was mechanically derived by API Evangelist from the first-party public Postman collection "Finalcad One API" served by Finalcad at https://developer.finalcad.com/ (collection JSON: https://developer.finalcad.com/api/collections/10995648/Tz5v1Es2), saved in this repo at collections/finalcad.postman_collection.json. Every path, method, header, query parameter, example request body and example response below is carried over from that collection; nothing was invented. Request/response bodies are typed as generic objects because the collection carries examples, not schemas. Four Finalcad employees'' personal e-mail addresses that appeared in the collection''s example payloads were replaced with placeholders; nothing else was changed.'
  contact:
    name: Finalcad One API — developer portal
    url: https://developer.finalcad.com/
  x-generated-by: API Evangelist enrichment pipeline (derived from the first-party Postman collection)
  x-source: collections/finalcad.postman_collection.json
  x-source-url: https://developer.finalcad.com/
servers:
- url: https://developer.finalcad.cloud/api
  description: Production — the baseUrl variable published in the Finalcad One API Postman collection.
- url: https://developer.sandbox.finalcad.cloud/api
  description: Sandbox — published by Finalcad in the 'Retrieve data in Power BI' tutorial of the same collection.
security:
- apiKey: []
  tokenAuth: []
tags:
- name: Exports
paths:
  /projects/{project_id}/forms/custom/generate:
    post:
      operationId: exportsCreateCustomReportForForms
      summary: Create custom report for forms
      description: "You can generate a unit report from a form instance using a custom report template.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body mandatory infos \n Details \n\n form_instance_id \n Id of the form instance \n\n custom_template_id \n id of the custom template \n(returned by the Get Custom template infos endpoint) \n\n output_file_format \n output file format \n(sould be part of the list returned by the Get Custom template infos endpoint) \n\n time_zone \n text of the time zone (defalut to the project timezone)"
      tags:
      - Exports
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              form_instance_id: <uuid>
              custom_template_id: '{{custom_template_id}}'
              output_file_format: PDF
              time_zone: Europe/Paris
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    key: YzhhZWEyZmMtM2NjMy00MzdiLThiOTYtOGI0MzIxOTkxZDY0
        '400':
          description: Bad Request — an `api_code` static error code and message envelope. See errors/finalcad-problem-types.yml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized — the API key or user token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error — a constructed `{ProcessCode}_ERR{n}` api_code envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /projects/{project_id}/forms/report/generate:
    post:
      operationId: exportsCreateFormsUnitExportInPdf
      summary: Create forms unit export in PDF
      description: "You can generate a unit PDF report from a selection of form instances.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body mandatory selection info \n Details \n\n form_instance_ids \n list of the Id of the form instances \n\n body optional selection info \n Details \n\n module_id \n Id of the module \n\n status_ids \n list of the status id \n\n priority_ids \n list of the priotities id \n\n form_ids \n list of the form templates ids \n\n plan_ids \n list of the locations ids \n\n folder_ids \n list of the ids of the folders of locations \n\n assignee_ids \n list of assigned users ids \n\n assigned_company_ids \n list of assigned companies ids \n\n creator_ids \n list of creator ids \n\n due_date_from \n minimal due date \n\n due_date_to \n maximal due date \n\n updated_at_from \n updated fter this date \n\n updated_at_to \n updated before this date \n\n Body optional presentation info \n Details \n\n time_zone \n text of the time zone (defalut to the project timezone) \n\n logo1_url \n url of the logo used as company logo \n\n logo2_url \n url of the logo used as customer logo \n\n image_size \n small / medium / large / none \n\n with_linked_items \n if false (default) do not generate informations for linked items \n\n with_linked_items_location \n if false (default) do not generate informations about locations of linked items \n\n only_fileds_with_values \n if true, do not generate informations for the empty fields (false is the default)"
      tags:
      - Exports
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              form_instance_ids:
              - <uuid>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Export_for_a_template:
                  value:
                    key: ZGVmOGFmZDItNDMzZS00N2QyLWJjN2EtMDIzMGFlNmQ2ZDM3
                Export_a_form_instance:
                  value:
                    key: ZjhiNjQ1NzQtZThhYS00YTQxLWE4NjAtZTk0YTI0YTNiMzFj
                Export_a_module:
                  value:
                    key: MTEwNDhmMDgtYWI2ZC00YzI3LWFhODktYjZhODA3ZDRmNzcx
                all_selection_fields:
                  value:
                    key: MTEwNDhmMDgtYWI2ZC00YzI3LWFhODktYjZhODA3ZDRmNzcx
        '400':
          description: Bad Request — an `api_code` static error code and message envelope. See errors/finalcad-problem-types.yml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized — the API key or user token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error — a constructed `{ProcessCode}_ERR{n}` api_code envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /projects/{project_id}/forms/report/get:
    post:
      operationId: exportsGetFormsUnitExportInPdf
      summary: Get forms unit export in PDF
      description: "Get the URL of a unit report generated by the \"Create Forms PDF Unit\" endpoint.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body mandatory info \n Details \n\n key \n key returned by \"Create Forms Pdf Unit\" endpoint \n\n NOTICE: if the endpoint return is_available = false, the pdf report is in progress. Please retry later"
      tags:
      - Exports
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              key: '{{rapport_unit_key}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    url: https://tf-report-generation-service-api-...
                    is_available: true
                    is_in_error: false
                In_Progress:
                  value:
                    is_available: false
                    is_in_error: false
        '400':
          description: Bad Request — an `api_code` static error code and message envelope. See errors/finalcad-problem-types.yml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized — the API key or user token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error — a constructed `{ProcessCode}_ERR{n}` api_code envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /projects/{project_id}/forms/report/xls:
    post:
      operationId: exportsCreateFormsExportInXlsx
      summary: Create forms export in XLSX
      description: "Generate a unit PDF report from a selection of form instances.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body mandatory selection info \n Details \n\n module_id \n Id of the module \n\n body optional selection info \n Details \n\n form_instance_ids \n list of the Id of the form instances \n\n status_ids \n list of the status id \n\n priority_ids \n list of the priotities id \n\n form_ids \n list of the form templates ids \n\n plan_ids \n list of the locations ids \n\n assignee_ids \n list of assigned users ids \n\n assigned_company_ids \n list of assigned companies ids \n\n creator_ids \n list of creator ids \n\n due_date_from \n minimal due date \n\n due_date_to \n maximal due date \n\n updated_at_from \n updated fter this date \n\n updated_at_to \n updated before this date \n\n search_term \n\n group_ids \n ids of the groups \n\n phase_ids \n ids of the phases \n\n Body optional presentation info \n Details \n\n time_zone \n text of the time zone (defalut to the project timezone)"
      tags:
      - Exports
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              module_id: d079cbfb-aa63-45d6-83e3-e20e537a7031
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    file_name: TestExport_Forms_2024-03-28-10-54-38.xlsx
                    file_stream: 
                    content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '400':
          description: Bad Request — an `api_code` static error code and message envelope. See errors/finalcad-problem-types.yml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized — the API key or user token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error — a constructed `{ProcessCode}_ERR{n}` api_code envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /projects/{project_id}/observations/report/xls:
    post:
      operationId: exportsCreateObservationsExportInXlsx
      summary: Create observations export in XLSX
      description: "You can generate a unit PDF report from a selection of form instances.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body optional selection info \n Details \n\n observations_ids \n id of the observations \n\n module_id \n Id of the module \n\n status_ids \n list of the status id \n\n priority_ids \n list of the priotities id \n\n trades_ids \n list of the trades ids \n\n plan_ids \n list of the locations ids \n\n assignee_ids \n list of assigned users ids \n\n assigned_company_ids \n list of assigned companies ids \n\n creator_ids \n list of creator ids \n\n due_date_from \n minimal due date \n\n due_date_to \n maximal due date \n\n created_at_from \n created after this date \n\n created_at_to \n created before this date \n\n search_term \n\n group_ids \n ids of the groups \n\n phase_ids \n ids of the phases \n\n Body optional presentation info \n Details \n\n time_zone \n text of the time zone (defalut to the project timezone)"
      tags:
      - Exports
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    file_name: TestExport_Quality_2024-03-28-15-22-25.xlsx
                    file_stream: 
                    content_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        '400':
          description: Bad Request — an `api_code` static error code and message envelope. See errors/finalcad-problem-types.yml.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized — the API key or user token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Server error — a constructed `{ProcessCode}_ERR{n}` api_code envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      description: Finalcad One error envelope. `api_code` is either a static code (mostly 4xx, e.g. INVALID_INSTANCE_STATE) or a constructed code of the form {ProcessCode}_ERR{n} / {ProcessCode}_WRN{n} (mostly 5xx).
      properties:
        statut:
          type: integer
          description: HTTP status code, repeated in the body (spelled `statut`).
        api_code:
          type: string
          description: Internal Finalcad API error code.
        message:
          type: string
          description: Short explanation of the abnormality encountered.
        data:
          type: object
          description: Complementary data to help understand the error.
          additionalProperties: true
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Organization API key issued by Finalcad to organizations on an Enterprise licence. Sent on every call.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: '`Authorization: token <your_api_key>`, or `Authorization: bearer <user_token>` for the legacy user-token flow (POST /auth).'
