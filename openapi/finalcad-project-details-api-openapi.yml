paths:
  /organizations/{organization_id}/projects:
    post:
      operationId: projectDetailsCreateANewProject
      summary: Create a new project
      description: 'Creating a project from scratch can be as easy as 1, 2, 3.


        You need to specify your project name. To ensure that your project is correctly localized, language and time zone are mandatory.


        But you can go further:


        bodymandatory informations

        Details


        name

        Your best wording to describe your project. It will be displayed everywhere


        body optional information

        Details


        description

        Text field that should contain less than 255 characters


        workspace_id

        The workspace in which you want to create the project


        case_number

        Project reference aligned with your internal classification


        address

        Where your project is located


        end_date

        Your targeted project end date


        language

        If not set it will be French.


        time_zone

        See Get list of time zones


        module_ids

        An array of modules ids to be added

        see Get modules suggestions at organization or workspace level depending of your usage


        Langage help:

        Catalan = "ca"

        Chinese = "zh-Hans"

        English = "en"

        French = "fr"

        German = "de-DE"

        Italian = "it"

        Japanese = "ja"

        Netherland = "nl-NL"

        Portuguese = "pt"

        Spanish = "es"

        Thai = "th"

        Vietnamese = "vi"'
      tags:
      - Project  details
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `organization_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: <string>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    time_zone: Europe/Paris
                    language: fr
                    project_id: 267ae234-3f8f398a-76d4-4c0b-bd30-d76a3abcaf0e
                    organization_id: 2421734c-f191-4237-acd8-becf216eaae4
                    name: My project
                    end_date: '0001-01-01T00:00:00Z'
                    member_count: 0
                    is_archived: false
