                    priority_id: c5988ff9-62f1-4849-8403-38d5791be730
                    position_x: 0.5
                    position_y: 0.5
                    client_created_at: '2022-10-17T14:05:27.3993788Z'
                    module_id: 1e870757-f1df-452f-a86c-d4115c10bf43
