    post:
      operationId: formsCreateForm
      summary: Create form
      description: "Going along with the option to create a project from scratch, you can now also create forms using just a few parameters.\n\n Details \n\n project_id \n The ID of the project where the form will be created \n\n body optional info \n Details \n\n form_id \n The ID of the form template to be used \n\n name \n the name of the form instance \n\n body optional info \n Details \n\n priority_id \n The ID of the priority the form will be assigned \n\n status_id \n The ID of the status used for the new form. If not set the default one will be used \n\n assignee_id \n The user ID of the person that will be assigned to the form \n\n company_id \n The ID of the company that will be assigned to the form \n\n phase_id \n The ID of the phase that is set for the new form \n\n plan_id \n The ID of the plan that will be used ofr the form \n\n position_x \n X position of the pin on the plan \n\n position_y \n Y position of the pin on the plan \n\n due_date \n The date the form is due, set as a timestamp \n\n module_id \n Id of the module \n\n category_id \n id of the category \n\n latitude \n in decimal degres following ISO6709 \n\n longitude \n in decimal degres \nfollowing ISO6709 \n\n NOTICE: This endpoint only creates the form. It cannot edit the fields of the form"
      tags:
      - Forms
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              form_id: <uuid>
              name: <string>
              module_id: <uuid>
              category_id: '{{category_id}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Create_Form_with_phase:
                  value:
                    id: 6c5d14e5-3504-4516-a742-78c24d4b8c34
                    name: <string>
                    form_id: c5b6b135-89c2-484e-81a9-8d13f49086e2
