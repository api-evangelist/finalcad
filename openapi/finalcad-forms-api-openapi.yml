  /projects/{project_id}/form-answers/link:
    post:
      operationId: formsLinkItemToAnswer
      summary: Link item to answer
      description: "You can link an observation or a form to a form answer of a control field.\n\n Details \n\n project_id \n The ID of the project where the form reside \n\n Body mandatory info \n Details \n\n form_instance_id \n The ID of the form instance \n\n form_answer_id \n The ID of the answer you want to link \n\n target_id \n id of the linked item \n\n target_type \n sould be \"Observation\" or \"Form\" depending of the type of the linked item"
      tags:
      - Forms
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              form_instance_id: <uuid>
              form_answer_id: <uuid>
              target_id: <uuid>
              target_type: Observation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success:
                  value:
                    message_id: '523152392112308224'
        '400':
