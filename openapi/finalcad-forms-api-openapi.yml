  /projects/{project_id}/form-answers/{answer_id}:
    put:
      operationId: formsUpdateAnswer
      summary: Update answer
      description: "Based on a form ID, you can update the different fields of the form. Here is the list of field types you can fill from the API:\n\n Short answer\n\n Paragraph\n\n Single choice\n\n Multiple choice\n\n Control\n\n Phone\n\n Email\n\n Grid\n\n Disclaimer\n\n To do so, you have to get the field ID and type by using the \"Get form answer\" endpoint. Include the following info in the endpoint.\n\n Endpoint mandatory info \n Details \n\n project_id \n The ID of the project where the form has been created \n\n form_answer_id \n The ID of the form anwser \n\n Depending on type_field_presentation and type_field_data for each field you have to fill in the endpoint the following information\nbut the value_form_template_instance_id is mandatory\n\n Check the table on Post create form answer.\n\n if no value is sent in the endpoint, the existing value will remain the same\n\n for linked files type,\nyou can remove an attached file by deleting the answer"
