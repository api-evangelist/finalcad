- name: Forms
paths:
  /projects/{project_id}/form-answers:
    post:
      operationId: formsCreateAnswer
      summary: Create answer
      description: "Based on a form ID, you can fill the different fields of the form. Here is the list of field types you can fill from the API:\n\n Short answer\n\n Paragraph\n\n Single choice\n\n Multiple choice\n\n Control\n\n Phone\n\n Email\n\n Disclaimer\n\n Grid\n\n Signature\n\n Linked files\n\n To do so, you have to get the field ID and type by using the \"Get form answer\" endpoint. Include the following info in the endpoint.\n\n Endpoint mandatory info \n Details \n\n project_id \n The ID of the project where the form has been created \n\n Body mandatory info \n Details \n\n form_instance_id \n The ID of the form instance \n\n field_id \n The ID of the field you want to update \n\n Depending on type_field_presentation and type_field_data for each field you have to fill in the endpoint the following information\n\n Type \n type_field_data \n type_field_presentation \n Other field data \n Value to fill in the endpoint \n\n Text \n Text \n ShortAnswer \n \n value_string \n\n Paragraph \n Text \n Paragraph \n \n value_string \n\n Phone number \n Text \n PhoneNumber \n \n value_string \n\n Email \n Text \n Email \n \n value_string \n\n Number \n Number \n ShortAnswer \n \n value_numeric \n\n Date \n Calendar \n ShortAnswer \n form_field_sa_calendar.format_calendar \n=DateOnly \n value_date1 \n\n Time \n Calendar \n ShortAnswer \n form_field_sa_calendar.format_calendar \n=TimeOnly \n value_time1 \n\n Date&Time \n Calendar \n ShortAnswer \n form_field_sa_calendar.format_calendar \n=DateAndTime \n value_date1 and value_time1 \n\n RadioButton \n Text \n SingleChoice \n \n array_field_choices \n\n Checkboxes \n Text \n MultipleChoice \n \n array_field_choices \n\n OkKo (control) \nOkKoNeutral \n Text \n Control \n \n array_field_choices \n\n OkKo+NA \n Text \n Control \n form_field_sa_control.na_values_allowed=true \n na_value/ array_field_choices \n\n Grid \n Resources \n \n FormLink \n\n Disclaimer \n Text \n Disclaimer \n \n value_boolean \n\n Linked file \n Resources \n Attachments \n \n see below \n\n Signature \n Resources \n Signature \n \n see below \n\n Theses fields can not be set \n\n formula \n Text \n Formula \n\n For attaching files to a linked files field \nfirst, create a text answer for the field\nnext,use the 'link file to answer' to attach a media\nrepeat theses 2 steps for attaching another file\n\n For attaching files to to a signature field \nfirst, create a text answer for the field\nnext,use the 'link file to answer' to attach an image media\n\n For attaching items to a control field \nfirst, create an answer for the field\nnext,use the 'link item to answer' to attach an item\nrepeat the second step for attaching another item\n\n For grid row creation ,\nthe body should include 2 others keys :\ncreate_form_template_instance with value=true\ncreate_form_template_instance_for_grid with value=true\n\n For grid field creation \nthe body should include 2 others keys\ncreate_form_template_instance with value=true\nform_template_instance_id with value returned in value_form_template_instance_id by the grid creation\n\n It is not recommended to create a grid row without filling its fields\n\n For paragraph's you can add formated text html syntax with the following tag's"
      tags:
      - Forms
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              field_id: 001a6c1b-dfa7-4429-b4ef-570ccc684598
              form_instance_id: <uuid>
              create_form_template_instance: true
              value_string: Exemple de texte
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
