                    na_value: false
                    is_valid_content: true
                    client_created_at: '2023-03-09T09:33:39.3992492Z'
                    client_updated_at: '2023-03-09T09:33:39.3992492Z'
                Success_Date:
                  value:
                    id: 6698c260-7c7d-418e-995d-3bf5b25d8b5e
                    field_id: 314e2745-b5f2-46cb-95a2-fdcb9c880265
                    form_template_instance_id: d1f71cb7-0658-41e0-9da8-d7a8304f3a49
                    order: 0
                    value_date1: '2023-02-20T00:00:00Z'
                    na_value: false
                    is_valid_content: true
                    client_created_at: '2023-03-09T09:36:16.8152788Z'
                    client_updated_at: '2023-03-09T09:36:16.8152788Z'
                Success_Choice:
                  value:
                    id: 2765e3f7-c46a-465b-9657-a1e0afef4137
                    field_id: b6756d2f-d9b9-4061-acbd-eddba04ea9f9
                    form_template_instance_id: d1f71cb7-0658-41e0-9da8-d7a8304f3a49
                    order: 0
