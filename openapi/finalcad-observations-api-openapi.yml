    post:
      operationId: observationsCreateObservation
      summary: Create observation
      description: 'Going along with the option to create a project from scratch, you can now also create observations in a project using just a few parameters.


        Details


        project_id

        The ID of the project where the the observation will be created


        Body mandatory infos

        Details


        module_id

        Id of the module


        Body optional infos


        Details


        description

        Your best wording to describe the observation


        trade_id

        The ID of the category used in the observation


        common_observation_id

        The ID of the model used in the new observation


        priority_id

        The ID of the priority of the new observation. If not set the default one will be used


        status_id

        The ID of the status of the new observation.

        If not set the default one will be used


        assignee_id

        The ID of the user that will have the new observation assigned


        phase_id

        The ID of the phase that is set for the new observation.


        company_id

        The ID of the company that will be assigned to the new observation


        plan_id

        The ID of the plan used for the observation


        position_x

        X coordinate of the item regarding the affected 2D plan


        position_y

        Y coordinate of the item regarding the affected 2D plan


        due_date

        The due date of the observation, set as a date format


        group_id

        id of the linked discussion group

        this id is mandatory if the module settings is_group_mandatory=true


        latitude

        in decimal degres following ISO6709


        longitude

        in decimal degres

        following ISO6709


        Please note that the combinations for description , trade_id and common_observation_id are limited to only 3 specific cases:


        Case 1 : Description, Trade Id, Common observation Id


        Case 2 : Trade Id, Common observation Id


        Case 3 : Description'
      tags:
      - Observations
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              description: <string>
              module_id: <uuid>
              group_id: '{{group_id}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Create_Observation_with_phase:
                  value:
                    id: f547f0a9-583d-4cf0-8f9b-dda8efd41dd6
                    project_id: a1bf361f-abd4b854-523d-4857-8e82-b0d6325b07d1
                    description: <string>
                    priority_id: 94dccc2b-fecf-4725-86cb-3ec524c50654
                    position_x: 0.5
                    position_y: 0.5
                    client_created_at: '2022-10-17T14:06:32.830934Z'
