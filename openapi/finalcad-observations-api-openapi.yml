openapi: 3.2.0
info:
  title: Finalcad One Project Observations API
  version: '2.41'
  summary: 'Project-level operations for Finalcad One construction projects: project details, project libraries, members, locations (folders / plans / IFC), discussion groups, companies, modules (observations / forms / meetings), observations, forms and form answers, documents, phases, meetings and XLSX/PDF exports.'
  description: 'Project-level operations for Finalcad One construction projects: project details, project libraries, members, locations (folders / plans / IFC), discussion groups, companies, modules (observations / forms / meetings), observations, forms and form answers, documents, phases, meetings and XLSX/PDF exports.'
  contact:
    name: Finalcad One API — developer portal
    url: https://developer.finalcad.com/
  x-generated-by: API Evangelist enrichment pipeline (derived from the first-party Postman collection)
  x-source: collections/finalcad.postman_collection.json
  x-source-url: https://developer.finalcad.com/
servers:
- url: https://developer.finalcad.cloud/api
  description: Production — the baseUrl variable published in the Finalcad One API Postman collection.
- url: https://developer.sandbox.finalcad.cloud/api
  description: Sandbox — published by Finalcad in the 'Retrieve data in Power BI' tutorial of the same collection.
security:
- apiKey: []
  tokenAuth: []
tags:
- name: Observations
paths:
  /projects/{projectId}/observations/{observationId}:
    put:
      operationId: observationsUpdateObservation
      summary: Update observation
      description: 'You can now also modify observations in a project using just a few parameters.


        Details


        projectId

        The ID of the project where the the observation will be created


        observationId

        The ID the the observation


        Body mandatory infos


        Details


        description

        Your best wording to describe the observation


        Body optional infos


        Details


        trade_id

        The ID of the category used in the observation


        common_observation_id

        The ID of the model used in the new observation


        priority_id

        The ID of the priority of the new observation


        status_id

        The ID of the status of the new observation.


        assignee_id

        The ID of the user that will have the new observation assigned


        phase_id

        The ID of the phase that is set for the new observation.


        company_id

        The ID of the company that will be assigned to the new observation


        plan_id

        The ID of the plan used for the observation


        position_x

        X coordinate of the item regarding the affected 2D plan


        position_y

        Y coordinate of the item regarding the affected 2D plan


        due_date

        The due date of the observation, set as a date format


        module_id

        The ID of the module


        Please note that


        If an optional body field is not informed, the current value in the observation is preserved


        the trade_id sould be consistent with the module


        The combinations for description , trade_id and common_observation_id sould be consistent with the creation parameters'
      tags:
      - Observations
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
        description: Path variable `projectId` as published in the collection.
      - name: observationId
        in: path
        required: true
        schema:
          type: string
        description: Path variable `observationId` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              common_observation_id: '{{common_observation_id}}'
              trade_id: '{{trade_id}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                Success_rename:
                  value:
                    id: 86ce1c54-94b8-485a-9d36-f072134cb9fc
                    project_id: 2636691c-683681a0-1e49-499a-add7-0acb1ece9647
                    description: Reprise
