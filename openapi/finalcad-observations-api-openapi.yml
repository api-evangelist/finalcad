  /projects/{project_id}/observations/filter:
    post:
      operationId: observationsGetFilteredObservationIds
      summary: Get filtered observation IDs
      description: 'Get a filtered list of the observations.


        Details


        project_id

        The ID of the project where the the observation will be created


        Endpoint optional Query params

        Details


        limit

        max number od observations to get


        offset

        Returned after the first call.

        Offset index from where to begin getting observations.

        Send it for the next calls.


        Body optional infos


        Details


        modules_ids

        list of modules ids


        search_term

        string to filter descriptions


        status_ids

        list of status ids


        priority_ids

        list of priorities ids


        trade_ids

        list of categories ids


        plan_ids

        list of plans ids


        assignee_ids

        list of users ids


        company_ids

        list of companies ids


        creator_ids

        list of users ids


        phase_ids

        list of phases ids


        observation_ids

        list of observations ids


        due_date_from

        Date


        due_date_to

        Date


        created_at_from

        Date


        created_at_to

        Date'
      tags:
      - Observations
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
        description: Path variable `project_id` as published in the collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              modules_ids:
              - <uuid>
      responses:
        '200':
