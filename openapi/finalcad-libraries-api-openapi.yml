    put:
      operationId: librariesPriorityLibraryUpdateOrganizationPrioritiesLibrary
      summary: Update organization priorities library
      description: "Update your list of priorities.\n\n This cannot be done one by one. you need to manage your entire list of observation or form priorities to preserve all existing priorities. So, in case you want to...\n\n add new priorities to your list, you need to get the existing list, add the new ones to this list, and then send your request\n\n remove priorities from your list, you need to get the existing list, remove the targeted ones, and then send the request\n\n update some priorities, you need to get the existing list, change the targeted field values, and then send the request\n\n Endpoint mandatory parameters \n Details \n\n organization_id \n id of your organization \n\n Body parameters \n détail \n\n module_type \n observation or form \n\n and a list of \n\n position \n order in the list \n\n color \n rgb code of the color \n\n icon \n icon name \n\n is_default \n true for the default one \nfalse else \n\n names \n list of names and langages"
