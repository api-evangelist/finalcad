  /projects/{project_id}/documents/{document_id}:
    get:
      operationId: documentsGetDocumentOrFolder
      summary: Get document or folder
      description: "Before creating folders or documents, you might want to have an overview of those already deployed in your project. This helps you manage them based on the current context.\n\n You can retrieve both folders and documents.\n\n Endpoint mandatory infos \n Details \n\n project_Id \n the id of the project to be modified \n\n document_id \n id the the document or folde to be checked"
      tags:
