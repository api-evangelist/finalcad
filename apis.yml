aid: finalcad
name: Finalcad
description: 'Finalcad is a French construction-technology company, founded in Paris in 2011, whose
  Finalcad One platform digitizes work on building sites — punch lists and defects ("observations"),
  quality and safety inspection forms, site meetings, plans and BIM models, documents, phases and
  subcontractor companies — across iOS and Android field apps, a web app (EU and APAC instances), an
  AutoCAD plugin and the Finalcad One API. The API is a REST surface of 201 published operations
  spanning organization and workspace administration, project setup and libraries, observations,
  forms and form answers, locations (folders, plans, IFC/RVT upload), documents, media upload,
  webhooks, XLSX/PDF exports and a daily Parquet dataset feed for Power BI. Access is restricted to
  organizations on the Enterprise licence, authenticated with an organization API key plus a
  per-caller authorization token. Finalcad merged with Wizzcad to form Advae, and Orisha acquired
  Advae in March 2025; Finalcad is now a solution of Orisha Construction, though the developer
  portal, the API host and the help centre remain live on the Finalcad domains.'
