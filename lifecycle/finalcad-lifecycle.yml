corporate:
  event: acquisition
  date: '2025-03-04'
  detail: >-
    Finalcad merged with Wizzcad to form Advae, and Orisha acquired Advae in March 2025. Finalcad is
    now a solution of Orisha Construction. www.finalcad.com 301s to
    https://www.orisha.com/fr/construction/logiciel/finalcad/ and www.finalcad.com/products/integration
    301s to https://www.orisha.com/fr/construction/logiciel/finalcad-api/. The API host
    (developer.finalcad.cloud), the sandbox host, the developer portal (developer.finalcad.com) and
    the help centre remain live on the Finalcad domains.
  sources:
  - https://www.orisha.com/blog/news/advae-rejoind-orisha/
  - https://construction.orisha.com/blog/corporate/editeur-logiciels-advae-finalcad-wizzcad-rejoint-orisha-construction/
