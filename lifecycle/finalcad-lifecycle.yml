  Versioning and release facts read from the Release notes section of Finalcad's developer portal;
  status pages probed live; deprecation posture derived from the OBSOLETE markers Finalcad writes
  into its own collection.

versioning:
  scheme: release-train
  current: '2.41'
  current_date: '2025-06-10'
  in_url: false
  in_header: false
  policy_published: false
  note: >-
    Releases are announced as "API <major>.<minor> - <date>" in the portal's Release notes. There is
    no version segment in the base path (https://developer.finalcad.cloud/api), no version header
    and no version query parameter, so every caller is on the current release at all times.
  detail: changelog/finalcad-changelog.yml

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  practice: in-band-docs-marker
  practice_note: >-
    Finalcad marks superseded surfaces in prose inside its own documentation rather than with a
    policy or a header. Two folders in the published collection are titled
    "OBSOLETE - Please use the media endpoints at the application level"
    (API / Project / Medias handeling, and its Chunk upload sub-folder — 6 operations), and the
    API 2.16 release note of 22 January 2024 says "our endpoint medias at project level are
    depreciated". No sunset date was given, and those operations are still published and still
    documented more than two years later.
  deprecated_operations:
  - operationId: mediasHandelingUploadMedias
    path: /projects/{project_id}/medias/uploads
    replacement: /medias/uploads
  - operationId: mediasHandelingGetMediaResource
    path: /medias/{media_id}
    replacement: /medias/{media_id}
  - operationId: mediasHandelingChunkUploadInit
    path: /projects/{project_id}/medias/uploadinit
    replacement: /medias/uploadinit
  - operationId: mediasHandelingChunkUploadUpload
    path: /projects/{project_id}/medias/{media_id}/uploadappend
    replacement: /medias/{media_id}/uploadappend
  - operationId: mediasHandelingChunkUploadTerminate
    path: /projects/{project_id}/medias/{media_id}/uploadterminate
    replacement: /medias/{media_id}/uploadterminate
  - operationId: mediasHandelingChunkUploadAbort
    path: /projects/{project_id}/medias/{media_id}/uploadabort
    replacement: /medias/{media_id}/uploadabort
  legacy_operations:
  - operationId: getUserToken
    path: /auth
    note: >-
      Described by Finalcad as "Legacy endpoint to get user_token". Superseded by the API-key form
      introduced in API 2.10 (17 July 2023), which states the authentication endpoint is no longer
      required. Still published, no sunset date.

