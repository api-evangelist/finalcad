notes: >-
  Finalcad publishes a dated "Release notes" section as the first item of its developer portal
  (the Finalcad One API Postman documenter). Entries below are transcribed from it. The full
  history runs from API 1.0 (19 May 2021) to API 2.41 (10 June 2025); the recent window is
  captured here and the complete text is preserved in
  collections/finalcad.postman_collection.json.

