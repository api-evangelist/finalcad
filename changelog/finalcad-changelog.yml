staleness:
  days_since_last_release: 434
  as_of: '2026-08-17'
  note: >-
    The most recent published release note is API 2.41, 10 June 2025 — over fourteen months before
    this pass. In March 2025 Finalcad's parent Advae (the Finalcad + Wizzcad merger) was acquired by
    Orisha and the product became part of Orisha Construction; finalcad.com now 301s to
    orisha.com/fr/construction/. The API host and the developer portal are still live, but the
    release cadence visible on the portal stops shortly after the acquisition. Treat the version as
    current-but-quiet rather than actively shipping until a newer note appears.

breaking_change_policy:
  published: false
  note: >-
    No deprecation window, sunset policy or breaking-change policy is published. Historical release
    notes DO record breaking renames shipped inside a normal release — API 2.11 (31 July 2023)
    "fix positon_x attribute to position_x", "fix icone attribute to icon",
    "fix PinPositonX & PinPositonY to PositionX & PositionY", "fix AssignedCompanyId to CompanyId",
    "fix AssigneeTo to AssigneeId" — five field renames announced only in the changelog.

