excluded:
- flow: Member and role administration
  reason: >-
    The membership operations (membersAddMembers, membersChangeRole, membersChangeSeveralRoles,
    projectMembersManagementRemoveMembersInAProject and their project-level siblings) are
    access-control decisions that also return named individuals. They appear as a supporting step
    inside finalcad-onboard-project, but are deliberately not packaged as a standalone skill an
    agent could run unattended.
- flow: Deletion
  reason: >-
    Only projectDetailsDeleteAProject has a documented restore counterpart. Deleting plans, folders,
    documents, phases, answers, trades or companies is irreversible against live construction
    records, and there is no idempotency or dry-run affordance to make it safe.
- flow: Authentication via POST /auth
  reason: >-
    Finalcad labels it a legacy endpoint and it takes a login and password in the request body.
    Skills use the API-key form Finalcad introduced in API 2.10 instead.
