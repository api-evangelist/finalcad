notes: >-
  Searched npm, PyPI and RubyGems for a Finalcad One API client, and read the developer portal and
  help centre for an SDK page. There is NO first-party (or third-party) client library for the
  Finalcad One API on any registry. The only integration artifacts Finalcad publishes are the
  Postman collection itself and a Power BI dashboard template. The packages listed below are real
  first-party open-source releases from the FinalCAD GitHub organization, but they are internal
  Ruby/iOS engineering utilities — none of them wraps the API — so no `SDKs` pointer is emitted for
  this provider.

