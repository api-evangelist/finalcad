gaps:
- >-
  No language SDK in any registry means every integrator hand-rolls HTTP against a two-header auth
  scheme and a cursor format Finalcad describes only in prose.
- >-
  The Postman collection is the de-facto client artifact and it is unversioned, so there is no way
  to pin an integration to an API release.
