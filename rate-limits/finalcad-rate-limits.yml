not_rate_limits:
- name: pagination limit
  value: 50 (default), sent as the `limit` query parameter
  detail: >-
    Maximum number of elements returned per call. Published examples also show limit=500 in
    organization and project listings, so the ceiling is higher than the default; the ceiling itself
    is not documented. Constraint: `offset` must be a multiple of `limit` or the call returns 400
    INVALID_INSTANCE_STATE.
- name: media chunk size
  value: 5242880 bytes
  detail: >-
    Minimum (and, except for the final part, exact) size of an upload part in the chunked media
    flow. Files at or below 5 MB may use the single-shot upload instead.
- name: chunked upload session TTL
  value: 3600 seconds
  detail: expires_after_secs returned by POST /medias/uploadinit.
- name: dataset generation cadence
  value: once a day at 06:00
  detail: >-
    Organization datasets for Power BI are regenerated daily, which is an effective freshness limit
    on the bulk-export path rather than a request limit.

inference_risk: >-
  The API is fronted by AWS API Gateway (x-amz-apigw-id on every response), which has account- and
  stage-level throttling available. Whether Finalcad has configured any is not observable without a
  key, and no limit is asserted here on the strength of the infrastructure alone.

gaps:
- An integrator cannot size a bulk backfill — there is no documented request-per-second budget.
- No 429 is documented anywhere, so client retry logic has nothing to key on.
- No rate-limit headers means limits, if they exist, are invisible at runtime.
