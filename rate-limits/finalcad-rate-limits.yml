notes: >-
  Finalcad publishes no rate limits. The whole developer portal — Getting started, Common behaviors
  (Errors, Differential behavior, Language selection), every endpoint description and every
  step-by-step tutorial — contains no quota, no throttle, no burst allowance, no 429 response and no
  rate-limit header. Live unauthenticated probes of the API host returned no RateLimit-*,
  X-RateLimit-* or Retry-After headers either. What Finalcad publishes instead are two PAGING
  limits, which are not rate limits and are recorded separately below so they are not mistaken for
  one.
